title: Java4Shell Post-Exploit - Windows Java Process Spawning Shell or LOLBin
id: 4f22c0a1-6d33-4b3e-9f10-e1a2b3c4d502
# After Java4Shell RCE on a Windows host the JVM becomes a process broker; watch
# for java.exe/javaw.exe launching shells or download/execution LOLBins.
status: stable
description: java.exe or javaw.exe spawning cmd.exe, powershell.exe, wscript/cscript, certutil, rundll32 or regsvr32 — post-RCE indicator for Java4Shell exploitation.
date: 2026/11/18
modified: 2026/11/18
references:
  - https://calif.io/java4shell
  - CVE-2026-114938
tags:
  - attack.execution
  - attack.t1059
  - attack.t1059.001
  - attack.t1105
  - cve.2026.114938
author: IONSEC Detection Engineering
logsource:
  category: process_creation
  product: windows
detection:
  selection_java_parent:
    ParentImage|endswith:
      - '\java.exe'
      - '\javaw.exe'
  selection_children:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\certutil.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
  condition: selection_java_parent and selection_children
falsepositives:
  # Signed vendor updaters and some app-server service wrappers launch cmd/powershell.
  - Vendor service wrappers and auto-updaters that shell out from java.exe; baseline legit pairs (parent cmdline, child, user) before alerting
level: high
