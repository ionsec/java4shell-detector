{
  "//": "Java4Shell (CVE-2026-114938) osquery pack. Inventory + host-surface checks. Trigger facts: 64x'A'+'=' (65 chars), 128x'A'+'=' on JDK17; crash artifact hs_err_pid*.log; mitigation flags -XX:-UseBASE64Intrinsics / -XX:DisableIntrinsic=_base64_decodeBlock / -XX:UseAVX=2. CPU requirement: avx512f + avx512bw + avx512vbmi + bmi2 (x86-64 only). DESTRUCTIVE-PROBE NOTE: never send trigger payloads to production services to 'test' — on Temurin 17.0.21+9 + Spring Security/Tomcat it kills the JVM pre-auth (exit 134 + hs_err log); use the ../detector/ tool instead.",
  "queries": {
    "Java4Shell_CPU_AVX512_flags": {
      "query": "SELECT name AS feature FROM cpuid WHERE (feature='avx512f' OR feature='avx512bw' OR feature='avx512vbmi' OR feature='bmi2');",
      "interval": 3600,
      "description": "CPU feature flags needed by the vulnerable decoder intrinsic. LIMITATION: osquery's cpuid table documents a small canonical list; avx512vbmi may only be exposed when the host kernel/libcpuid carries that name, and many osquery builds return only the avx512f subset. If this query returns fewer than 4 rows, treat the box as UNKNOWN, not safe — correlate with `grep -m1 flags /proc/cpuinfo` via the pack's osquery-derived shell check or the detector tool. Best-available check on current osquery builds; a missing 'avx512vbmi' row here is not proof of absence.",
      "platform": "linux,windows,macos"
    },
    "Java4Shell_JDK_inventory_linux_rpm": {
      "query": "SELECT name, version, release, install_time FROM rpm_packages WHERE (name LIKE 'java%' OR name LIKE 'jdk%' OR name LIKE 'jre%' OR name LIKE 'openjdk%' OR name LIKE 'corretto%' OR name LIKE 'temurin%' OR name LIKE 'zulu%' OR name LIKE 'liberica%' OR name LIKE 'sapmachine%');",
      "interval": 86400,
      "description": "Java runtimes installed via RPM. Compare version with fixed builds 17.0.21.1 / 21.0.13.1 / 25.0.5.1 / 27.0.1.1; anything 17.0.6+ without a 4th patch segment is vulnerable.",
      "platform": "linux"
    },
    "Java4Shell_JDK_inventory_linux_deb": {
      "query": "SELECT name, version, revision, install_date FROM deb_packages WHERE (name LIKE 'default-jdk%' OR name LIKE 'openjdk-%' OR name LIKE 'corretto-%' OR name LIKE 'temurin-%' OR name LIKE 'zulu-%' OR name LIKE 'liberica-%' OR name LIKE 'sapmachine-%');",
      "interval": 86400,
      "description": "Java runtimes installed via DEB. Same fixed-version comparison as the RPM query.",
      "platform": "linux"
    },
    "Java4Shell_JDK_inventory_windows": {
      "query": "SELECT name, version, publisher, install_date FROM programs WHERE (name LIKE '%JDK%' OR name LIKE '%Java%' OR name LIKE '%Corretto%' OR name LIKE '%Temurin%' OR name LIKE '%Zulu%' OR name LIKE '%Liberica%' OR name LIKE '%SapMachine%' OR name LIKE '%OpenJDK%' OR name LIKE '%GraalVM%');",
      "interval": 86400,
      "description": "Windows program inventory for JDK/JRE-family installs; Oracle-style builds are the priority targets for versioning.",
      "platform": "windows"
    },
    "Java4Shell_hs_err_files": {
      "query": "SELECT path, size, mtime, atime FROM file WHERE path IN ('/tmp/hs_err_pid%.log', '/opt/hs_err_pid%.log', '/opt/*/hs_err_pid%.log', '/opt/*/*/hs_err_pid%.log', '/var/lib/*/hs_err_pid%.log', '/var/log/jenkins/hs_err_pid%.log', '/usr/share/*/hs_err_pid%.log');",
      "interval": 300,
      "description": "Existence of JVM fatal-error logs (crash artifact for CVE-2026-114938; exit 134 accompanies it). LIMITATION: this is a point-in-time poll of the paths listed; file_events/FIM-based realtime rules are the only way to catch these immediately as they appear — osquery osquery_fim.conf/file_events is not part of the stock config, so keep the 300s interval tight or add file_events watches. Expand the path list to cover your app layout.",
      "platform": "linux,macos"
    },
    "Java4Shell_running_java_processes": {
      "query": "SELECT pid, name, path, cmdline, cwd, parent FROM processes WHERE name IN ('java','java.exe','javaw.exe') OR cmdline LIKE '%%-XX:UseBASE64Intrinsics%%' OR cmdline LIKE '%%-XX:-UseBASE64Intrinsics%%' OR cmdline LIKE '%%DisableIntrinsic=_base64_decodeBlock%%' OR cmdline LIKE '%%-XX:UseAVX=2%%';",
      "interval": 300,
      "description": "Running java processes; their cmdline shows which mitigation flags (if any) are applied. A java process with an affected JDK path and NO -XX:-UseBASE64Intrinsics flag is an exposed workload; correlate pid->cwd against app dirs and the hs_err file watch.",
      "platform": "linux,windows,macos"
    },
    "Java4Shell_mitigation_coverage_linux": {
      "query": "SELECT CASE WHEN COUNT(*) > 0 THEN 1 ELSE 0 END AS mitigated, COUNT(*) AS java_procs FROM processes WHERE name = 'java' AND (cmdline LIKE '%%-XX:-UseBASE64Intrinsics%%' OR cmdline LIKE '%%DisableIntrinsic=_base64_decodeBlock%%' OR cmdline LIKE '%%-XX:UseAVX=2%%');",
      "interval": 1800,
      "description": "Coverage metric: how many running JVMs carry a Java4Shell mitigation flag. Gaps go hand in hand with the running_java_processes query — use both to drive rollout.",
      "platform": "linux"
    }
  }
}
